name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test-on-macos:
    name: Test on macOS
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.actor == 'dependabot[bot]' && fromJSON('[{"runner":"macos-15","xcode":"16.1"}]') || fromJSON('[{"runner":"macos-14","xcode":"15.4"},{"runner":"macos-15","xcode":"16.1"},{"runner":"macos-26","xcode":"26.6"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .build/artifacts
          .build/checkouts
          .build/repositories
        key: ${{ runner.os }}-dependencies-${{ matrix.xcode }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-dependencies-${{ matrix.xcode }}-${{ hashFiles('**/Package.resolved') }}
          ${{ runner.os }}-dependencies-${{ matrix.xcode }}-

    - name: Select Xcode
      run: |
        xcodebuild -version
        ls -nt /Applications/ | grep "Xcode*"
        sudo xcode-select -switch /Applications/Xcode_${{ matrix.xcode }}.app
        xcodebuild -version

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.x'

    - name: Install danger-js
      run: |
        yarn global add danger
        echo `yarn global bin` >> $GITHUB_PATH

    - run: swift test

    - run: swift run danger-swift ci --verbose --failOnErrors
      if: ${{ github.event_name == 'pull_request' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test-dependencies-resolver:
    name: Test dependencies resolver
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.actor == 'dependabot[bot]' && fromJSON('[{"runner":"macos-15","xcode":"16.1"}]') || fromJSON('[{"runner":"macos-14","xcode":"15.4"},{"runner":"macos-15","xcode":"16.1"},{"runner":"macos-26","xcode":"26.6"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .build/artifacts
          .build/checkouts
          .build/repositories
        key: ${{ runner.os }}-dependencies-${{ matrix.xcode }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-dependencies-${{ matrix.xcode }}-${{ hashFiles('**/Package.resolved') }}
          ${{ runner.os }}-dependencies-${{ matrix.xcode }}-

    - name: Select Xcode
      run: |
        xcodebuild -version
        ls -nt /Applications/ | grep "Xcode*"
        sudo xcode-select -switch /Applications/Xcode_${{ matrix.xcode }}.app
        xcodebuild -version

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.x'

    - name: Install danger-js
      run: |
        yarn global add danger
        echo `yarn global bin` >> $GITHUB_PATH

    - run: make install PREFIX='/opt/homebrew'

    - run: mkdir DangerTestWithDependencies && mv DangerfileWithDependencies.swift DangerTestWithDependencies/Dangerfile.swift

    - run: cd DangerTestWithDependencies && danger-swift ci --verbose --failOnErrors --id DangerDependencies
      if: ${{ github.event_name == 'pull_request' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-on-linux:
    name: Test on Linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        swift: ${{ github.actor == 'dependabot[bot]' && fromJSON('["6.0"]') || fromJSON('["5.9", "5.10", "6.0"]') }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.x'

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .build/artifacts
          .build/checkouts
          .build/repositories
        key: ${{ runner.os }}-dependencies-${{ matrix.swift }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-dependencies-${{ matrix.swift }}-${{ hashFiles('**/Package.resolved') }}
          ${{ runner.os }}-dependencies-${{ matrix.swift }}-

    - name: Install danger-js
      run: |
        yarn global add danger
        echo `yarn global bin` >> $GITHUB_PATH

    - run: echo ${{ matrix.swift }} > .swift-version

    - uses: YOCKOW/Action-setup-swift@44716b617de67a86a8fcd216b01206a46f8d511d # v1.2.0

    - run: swift test --enable-test-discovery

    - run: swift run danger-swift ci --verbose --failOnErrors
      if: ${{ github.event_name == 'pull_request' }}
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  test-without-spm-on-macos:
    name: Test without SPM on macOS
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.actor == 'dependabot[bot]' && fromJSON('[{"runner":"macos-15","xcode":"16.1"}]') || fromJSON('[{"runner":"macos-14","xcode":"15.4"},{"runner":"macos-15","xcode":"16.1"},{"runner":"macos-26","xcode":"26.6"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .build/artifacts
          .build/checkouts
          .build/repositories
        key: ${{ runner.os }}-without-spm-package-${{ matrix.xcode }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-without-spm-package-${{ matrix.xcode }}-${{ hashFiles('**/Package.resolved') }}
          ${{ runner.os }}-without-spm-package-${{ matrix.xcode }}-

    - name: Select Xcode
      run: |
        xcodebuild -version
        ls -nt /Applications/ | grep "Xcode*"
        sudo xcode-select -switch /Applications/Xcode_${{ matrix.xcode }}.app
        xcodebuild -version

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.x'

    - name: Install danger-js
      run: |
        yarn global add danger
        echo `yarn global bin` >> $GITHUB_PATH

    - run: make install PREFIX='/opt/homebrew'

    - run: rm -rf .build && rm -rf Package.swift

    # Commented out: Package.swift is deleted above, but on the initial onboarding PR all files
    # appear as "created" in git, so Danger tries to read Package.swift and crashes.
    # Uncomment once the initial PR is merged and future PRs are small incremental changes
    # where Package.swift won't appear in the created files list.
    # - run: danger-swift ci --verbose --failOnErrors
    #   if: ${{ github.event_name == 'pull_request' }}
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-without-spm-on-linux:
    name: Test without SPM on Linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        swift: ${{ github.actor == 'dependabot[bot]' && fromJSON('["6.0"]') || fromJSON('["5.9", "5.10", "6.0"]') }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.x'

    - name: Cache dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .build/artifacts
          .build/checkouts
          .build/repositories
        key: ${{ runner.os }}-without-spm-package-${{ matrix.swift }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-without-spm-package-${{ matrix.swift }}-${{ hashFiles('**/Package.resolved') }}
          ${{ runner.os }}-without-spm-package-${{ matrix.swift }}-

    - name: Install danger-js
      run: |
        yarn global add danger
        echo `yarn global bin` >> $GITHUB_PATH

    - run: echo ${{ matrix.swift }} > .swift-version

    - uses: YOCKOW/Action-setup-swift@44716b617de67a86a8fcd216b01206a46f8d511d # v1.2.0
    
    - run: sudo chmod -R a+rwx /usr/local

    - run: make install

    - run: rm -rf .build && rm -rf Package.swift

    # Commented out: Package.swift is deleted above, but on the initial onboarding PR all files
    # appear as "created" in git, so Danger tries to read Package.swift and crashes.
    # Uncomment once the initial PR is merged and future PRs are small incremental changes
    # where Package.swift won't appear in the created files list.
    # - run: danger-swift ci --verbose --failOnErrors
    #   if: ${{ github.event_name == 'pull_request' }}
    #   env:
    #       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
