included:
  - Sources
  - Tests
excluded:
  - Tests/**/*Resources # files in this directory contains only JSON strings.
  - Tests/**/XCTestManifests.swift # auto-generated file
line_length:
  warning: 140 # needs discussion (default: 120)
  error: 350 # needs discussion (default: 200)
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true
identifier_name:
  excluded:
    - ci
    - id
    - pr
disabled_rules:
  - trailing_comma
  - blanket_disable_command # pre-existing codebase pattern, written before this rule existed
  - force_try              # pre-existing violations; disable for initial onboarding PR, re-enable after merge
  - large_tuple            # pre-existing violations; disable for initial onboarding PR, re-enable after merge
